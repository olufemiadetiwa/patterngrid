<!DOCTYPE html>
<html lang="en-GB" class=" "><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Grid — Data, AI and Business Intelligence Consulting</title>
<meta name="description" content="Pattern Grid helps organisations connect data, build trusted reporting and apply practical AI to improve business decisions.">
<meta name="theme-color" content="#07131C">
<meta name="color-scheme" content="light">
<script>
  /* Base path: empty on any root host; "/<repo>" on a GitHub project page.
     The stylesheet is written from here rather than as a static relative tag,
     because the preload scanner resolves relative URLs before any <base>
     exists and would request them under a deep link's own path. */
  (function () {
    var base = "/patterngrid";
    if (base === '/') base = '';
    window.PG_BASE = base;
    if (/[?&]pgstatic=1/.test(location.search)) document.documentElement.className += ' is-static';
    document.write(
      '<link rel="preload" href="' + base + '/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>' +
      '<link rel="stylesheet" href="' + base + '/assets/css/fonts.css">' +
      '<link rel="stylesheet" href="' + base + '/assets/css/site.css">' +
      '<link rel="icon" href="' + base + '/favicon.svg" type="image/svg+xml">' +
      '<link rel="manifest" href="' + base + '/manifest.webmanifest">'
    );
  })();
</script>

<link rel="preconnect" href="https://images.unsplash.com" crossorigin="">

<link rel="preload" as="image" href="/patterngrid/assets/img/hero/office-meeting-3-m.webp" media="(max-width: 720px)" fetchpriority="high" data-hero-preload="office-meeting-3"><link rel="preload" as="image" href="/patterngrid/assets/img/hero/office-meeting-3-d.webp" media="(min-width: 721px)" fetchpriority="high" data-hero-preload="office-meeting-3"></head>
<body>

<div class="app">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" id="header"></header>
  <div id="drawer"></div>

  <main id="main" tabindex="-1">
    <div id="page" data-prerendered></div>
  </main>

  <footer class="site-footer grid-field" id="footer"></footer>
</div>

<noscript>
  <div style="max-width:720px;margin:120px auto;padding:0 24px">
    <h1 style="font-size:32px;font-weight:600;letter-spacing:-.02em">Pattern Grid</h1>
    <p style="margin-top:16px;line-height:1.6">Pattern Grid helps organisations connect data, build trusted reporting and apply practical AI to improve business decisions. This site needs JavaScript to display its pages. Email us and we will answer any question directly.</p>
  </div>
</noscript>

<script>
  /* Scripts are written with the resolved base for the same reason as the
     stylesheet above; document.write during parsing keeps them in order. */
  (function () {
    var b = window.PG_BASE || '';
    ['config', 'content', 'service-content', 'local-images', 'core', 'seo', 'hero', 'scenes', 'shell', 'pages/home', 'pages/services', 'pages/industries', 'pages/work', 'pages/insights', 'pages/about', 'pages/assessment', 'pages/contact', 'pages/legal', 'pages/not-found', 'app'].forEach(function (f) {
      document.write('<script src="' + b + '/assets/js/' + f + '.js"><\/script>');
    });
  })();
</script>


</body></html>
