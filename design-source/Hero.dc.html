</helmet>
<div style="font-family: 'Hanken Grotesk', system-ui, sans-serif;">
  <section aria-roledescription="carousel" aria-label="{{ ariaLabel }}" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" onFocus="{{ focusOn }}" onBlur="{{ focusOff }}" onTouchStart="{{ touchStart }}" onTouchEnd="{{ touchEnd }}" style="position: relative; background: #07131C; color: #FFFFFF; overflow: hidden; display: flex; align-items: flex-end; min-height: {{ minH }};">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="1">

    <div style="position: relative; width: 100%; max-width: 1440px; margin: 0 auto; padding: 120px clamp(20px, 5vw, 80px) clamp(72px, 9vw, 112px); display: flex; flex-direction: column; gap: 16px;">
      <sc-if value="{{ hasLines }}" hint-placeholder-val="{{ true }}">

  <sc-if value="{{ hasBand }}" hint-placeholder-val="{{ false }}">
    <div style="background: #02203D; color: #FFFFFF;">
      <div style="max-width: 1440px; margin: 0 auto; padding: clamp(32px, 4vw, 56px) clamp(20px, 5vw, 80px); display: flex; flex-direction: column; gap: 14px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: #38A0C3;">{{ bandEyebrow }}</span>
        <h1 style="margin: 0; font-weight: 650; letter-spacing: -0.03em; line-height: 1.04; font-size: clamp(34px, 4.6vw, 72px); max-width: 20ch; text-wrap: balance;">{{ bandTitle }}</h1>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasStatement }}" hint-placeholder-val="{{ true }}">
    <section data-pg-statement="true" style="background: {{ stBg }}; color: {{ stInk }};">
      <div style="max-width: 1440px; margin: 0 auto; padding: clamp(72px, 9vw, 144px) clamp(20px, 5vw, 80px) clamp(72px, 9vw, 144px); display: flex; flex-direction: column; align-items: center; text-align: center;">
        <p style="margin: 0 auto; font-size: clamp(28px, 3.9vw, 62px); font-weight: 520; line-height: 1.15; letter-spacing: -0.02em; max-width: 24ch; text-wrap: balance; text-align: center;"><sc-for list="{{ words }}" as="w" hint-placeholder-count="30"><span style="color: {{ w.color }}; transition: color 160ms linear;">{{ w.text }} </span></sc-for></p>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 1200}, &quot;page&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;services&quot;, &quot;services/data-ai-strategy&quot;, &quot;industries&quot;, &quot;work&quot;, &quot;insights&quot;, &quot;about&quot;, &quot;founder&quot;, &quot;approach&quot;, &quot;assessment&quot;, &quot;contact&quot;, &quot;privacy&quot;, &quot;notfound&quot;]}, &quot;paused&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;bandTitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;bandEyebrow&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { wide: typeof window !== 'undefined' ? window.innerWidth >= 1100 : true, idx: 0, prevIdx: -1, userPaused: this.sessionPaused(), manual: false, hover: false, focus: false, visible: true, hidden: false, progress: 0, announce: '', rm: this.readRm() };

  componentDidMount() {

    window.dispatchEvent(new CustomEvent('pg-hero', { detail: true }));

    this.onMotion = () => this.setState({ rm: this.readRm() });
    this.onWide = () => { const w = window.innerWidth >= 1100; if (w !== this.state.wide) this.setState({ wide: w }); }; window.addEventListener('resize', this.onWide);
    this.onScroll = () => { if (this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = null; this.measure(); }); };
    document.addEventListener('visibilitychange', this.onVis);

    window.addEventListener('resize', this.onScroll);

      const sec = document.querySelector('[data-pg-statement]');

  componentDidUpdate(prev) { if (prev.page !== this.props.page) { this.setState({ idx: 0, prevIdx: -1, manual: false, announce: '', progress: 0 }); setTimeout(() => { this.statementEl = document.querySelector('[data-pg-statement]'); this.measure(); }, 80); } }
  measure() {
    const el = this.statementEl || document.querySelector('[data-pg-statement]'); if (!el) return; this.statementEl = el;
    const r = el.getBoundingClientRect(), vh = window.innerHeight || 800;
    const p = Math.max(0, Math.min(1, (vh * 0.92 - r.top) / (vh * 0.55)));

  }
  canPlay() { const s = this.state; return !s.rm && !s.userPaused && !s.manual && !s.hover && !s.focus && s.visible && !s.hidden && !this.props.paused && this.hero().images.length > 1; }

  go(n, manual) { const len = this.hero().images.length || 1; const idx = (n + len) % len; const h = this.hero(); const img = window.PG.img.get(h.images[idx]); this.setState({ prevIdx: this.state.idx, idx, manual: manual ? true : this.state.manual, announce: manual ? `Image ${idx + 1} of ${len}: ${img.alt}` : this.state.announce }); }

    const dark = h.tone === 'dark';
    const startC = dark ? '#4A5760' : '#B9BDBF', endC = dark ? '#FFFFFF' : '#07131C', emC = dark ? '#38A0C3' : '#17647D';
    const words = []; let strong = false;
    (h.statement || '').split(/\s+/).filter(Boolean).forEach(tok => { let t = tok, open = false, close = false; if (t.startsWith('**')) { open = true; t = t.slice(2); } if (t.endsWith('**') || /\*\*[.,;:]?$/.test(t)) { close = true; t = t.replace('**', ''); } if (open) strong = true; words.push({ text: t, strong }); if (close) strong = false; });

    const paused = s.userPaused || s.manual || rm;
    const HD = (PG.heroDataFor && PG.heroDataFor(this.props.page)) || { sources: [], cards: [], ticker: [] };

    const lineBase = (h.lines || []).length * 80 + 300;
    const cy = [51, 165, 279], sy = [40, 165, 290];
    const traces = HD.cards.map((_, i) => { const y1 = sy[i] || 165, y2 = cy[i] || 165; const len = 60; return { d: 'M112 ' + y1 + ' C130 ' + y1 + ' 132 ' + y2 + ' 150 ' + y2, len, off: rm ? 0 : len, anim: rm ? 'none' : 'pgTrace 700ms cubic-bezier(0.22,1,0.36,1) ' + (lineBase + 500 + i * 160) + 'ms forwards' }; });
    return {
      ariaLabel: (h.lines || []).join(' ') || this.props.bandTitle || 'Page images',
      minH: sizes[h.size] || sizes.marketing, h1Size: h1Sizes[h.size] || h1Sizes.marketing,
      slides, hasLines: (h.lines || []).length > 0,
      lines: (h.lines || []).map((t, i) => ({ text: t, anim: rm ? 'none' : `pgLineIn 720ms cubic-bezier(0.22,1,0.36,1) ${i * 80}ms both` })),
      counter: String(s.idx + 1).padStart(2, '0') + ' / ' + String(len).padStart(2, '0'),

      isPaused: paused, playLabel: paused ? 'Play image slideshow' : 'Pause image slideshow', playGlyph: paused ? '▶' : '❚❚',
      hoverOn: () => this.setState({ hover: true }), hoverOff: () => this.setState({ hover: false }),
      focusOn: () => this.setState({ focus: true }), focusOff: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) this.setState({ focus: false }); },
      touchStart: (e) => { const t = e.touches[0]; this.touch = { x: t.clientX, y: t.clientY }; },
      touchEnd: (e) => { if (!this.touch) return; const t = e.changedTouches[0]; const dx = t.clientX - this.touch.x, dy = t.clientY - this.touch.y; this.touch = null; if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) this.go(s.idx + (dx < 0 ? 1 : -1), true); },
      announce: s.announce,
      dataSources: HD.sources.map((n, i) => ({ name: n, anim: rm ? 'none' : 'pgLineIn 600ms cubic-bezier(0.22,1,0.36,1) ' + (lineBase + 300 + i * 120) + 'ms both' })),
      dataCards: HD.cards.map((c, i) => ({ ...c, accent: tone[c.tone] || tone.neutral, anim: rm ? 'none' : 'pgLineIn 700ms cubic-bezier(0.22,1,0.36,1) ' + (lineBase + i * 140) + 'ms both' })), traces,
      gridLine: dark ? 'rgba(255,255,255,0.05)' : 'rgba(7,19,28,0.055)',
      hasBand: !!this.props.bandTitle, bandTitle: this.props.bandTitle || '', bandEyebrow: this.props.bandEyebrow || '',
      hasStatement: !!h.statement, words: wordVals, stBg: dark ? '#07131C' : '#F5F5F1', stInk: dark ? '#FFFFFF' : '#07131C',
      hasAction: !!h.action, actionLabel: h.action ? h.action.label : '', actionHref: h.action ? h.action.href : '#',
      hasSecondary: !!h.secondary, secondaryLabel: h.secondary ? h.secondary.label : '', secondaryHref: h.secondary ? h.secondary.href : '#',
      ctaAnim: rm ? 'none' : `pgLineIn 720ms cubic-bezier(0.22,1,0.36,1) ${(h.lines || []).length * 80 + 80}ms both`,
      actionClick: (e) => { if (h.action && h.action.event) { e.preventDefault(); window.dispatchEvent(new CustomEvent(h.action.event)); } }
    };
  }
}
