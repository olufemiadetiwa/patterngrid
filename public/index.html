<script>
  /* Base path: empty on any root host; "/<repo>" on a GitHub project page.
     Set here so every asset and route below resolves under it. */
  (function () {
    var base = /\.github\.io$/.test(location.hostname) ? '/' + (location.pathname.split('/')[1] || '') : '';
    if (base === '/') base = '';
    window.PG_BASE = base;
    var b = document.createElement('base'); b.href = base + '/'; document.head.appendChild(b);
  })();
</script>
